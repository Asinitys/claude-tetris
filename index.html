<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Cambiar entre modo oscuro y claro">
            <span class="switch"></span>
            <span id="theme-label">Oscuro</span>
          </button>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">

          <!-- PAUSA -->
          <div id="pause-content" class="overlay-section">
            <p class="overlay-title">PAUSA</p>
            <div class="pause-buttons">
              <button id="btn-resume" class="pause-btn pause-btn--primary">Reanudar</button>
              <button id="btn-restart-pause" class="pause-btn">Reiniciar</button>
              <button id="btn-show-controls" class="pause-btn">Ver controles</button>
            </div>
            <div id="pause-controls" class="pause-controls-detail hidden">
              <ul>
                <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                <li><kbd>↑</kbd> rotar</li>
                <li><kbd>↓</kbd> bajar</li>
                <li><kbd>Space</kbd> caída</li>
                <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
              </ul>
            </div>
            <div class="level-picker">
              <span class="level-picker-label">NIVEL INICIAL</span>
              <div class="level-picker-row">
                <button id="level-dec" class="level-btn" aria-label="Disminuir nivel">−</button>
                <span id="start-level-val" class="level-val">1</span>
                <button id="level-inc" class="level-btn" aria-label="Aumentar nivel">+</button>
              </div>
            </div>
          </div>

          <!-- GAME OVER -->
          <div id="gameover-content" class="overlay-section hidden">
            <p id="overlay-title" class="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <button id="restart-btn">Reiniciar</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
